[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "anbu-curator"
version = "0.1.0"
description = "Local-first AI-assisted photo and social media post curator"
requires-python = ">=3.13"
license = "LicenseRef-Anbu-Source-Available-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
    "pydantic",
    "pillow",
    "httpx",
    "jinja2",
]

[tool.setuptools.packages.find]
where = ["src"]
